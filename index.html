        del===t.id?D('flex gap-1 shrink-0',h('button',{className:'btn',style:{padding:'4px 10px',color:'#ef4444'},onClick:()=>{setData(p=>({...p,txs:p.txs.filter(x=>x.id!==t.id)}));setDel(null);say('Đã xóa giao dịch')}},'Xóa?'),h('button',{className:'ib',onClick:()=>setDel(null)},h(Ic,{n:'X',s:16}))):D('flex shrink-0',h('button',{className:'ib',title:'Sửa',onClick:()=>setForm(t)},h(Ic,{n:'Pencil',s:16})),h('button',{className:'ib',title:'Xóa',onClick:()=>setDel(t.id)},h(Ic,{n:'Trash2',s:16}))))}))),
    form&&h(Form,{init:form,onSave:save,onClose:()=>setForm(null)}),
    bk&&h(Backup,{data,onImport:d=>{setData(d);say('Đã nhập dữ liệu')},onClose:()=>setBk(false)}),
    toast&&D('fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-full text-sm font-semibold text-white shadow-lg',{style:{}},null)&&h('div',{className:'fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-full text-sm font-semibold text-white shadow-lg',style:{background:'#0f172a'}},toast));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
